<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Medication Dashboard</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f2f2f7}
    *{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:22px 16px 40px}
    h1{font-size:1.8rem;margin:8px 0 18px}h2{font-size:1.18rem;margin:0 0 8px}
    .card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 3px #0000000d}
    input,button{font:inherit;padding:12px;border-radius:11px;border:1px solid #c7c7cc}
    input{width:100%}.primary{background:#087f5b;color:#fff;border:0;margin-top:10px;width:100%;font-weight:700}
    .muted{color:#6e6e73}.error,.missed{color:#d92d20}.taken{color:#178344}.unknown{color:#8a6d00}
    .status{font-weight:650}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
    .stat{background:#fff;border-radius:14px;padding:12px 8px;text-align:center}.stat b{display:block;font-size:1.35rem}.stat small{color:#6e6e73}
    .tabs{display:grid;grid-template-columns:1fr 1fr;background:#dedee3;border-radius:10px;padding:3px;margin:14px 0}
    .tabs button{border:0;background:transparent;padding:8px;font-weight:650}.tabs button.active{background:#fff;box-shadow:0 1px 4px #0002}
    .day-card{background:#dff5fa}.day-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #0001;padding-bottom:10px}
    .row{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #00000012}
    .day-head+.row{border-top:0}.dot{width:11px;height:11px;border-radius:50%;background:#b8b8bd}.dot.taken{background:#20a464}.dot.missed{background:#e5484d}.dot.unknown{background:#d5a824}
    .event-name{font-weight:650}.event-time{font-size:.9rem;color:#6e6e73}.med-card .row{grid-template-columns:1fr auto}
    .interval{border-left:5px solid #5ac8fa}.interval-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.interval-grid small{display:block;color:#6e6e73}.cross-day{color:#765500;font-size:.86rem;margin-top:3px}
    footer{font-size:.82rem;color:#6e6e73;margin-top:24px}
    @media(max-width:420px){.summary{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main>
  <h1>Medications</h1>
  <section id="unlock" class="card">
    <p>This dashboard is encrypted. Enter the shared family passphrase.</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="Passphrase">
    <button id="open" class="primary">Open dashboard</button>
    <p id="error" class="error" role="alert"></p>
  </section>
  <section id="dashboard" hidden>
    <div class="card"><h2 id="patient"></h2><p id="updated" class="muted"></p><p id="description"></p></div>
    <div id="stats" class="summary"></div>
    <div id="intervals"></div>
    <div class="tabs" role="tablist" aria-label="Dashboard view">
      <button id="day-tab" class="active" role="tab" aria-selected="true">By day</button>
      <button id="med-tab" role="tab" aria-selected="false">By medication</button>
    </div>
    <div id="records"></div>
    <div class="card"><h2>Notes</h2><div id="notes"></div></div>
  </section>
  <footer>For family reference only. Confirm clinical decisions with the treating clinician. Data is decrypted only on this device.</footer>
</main>
<script>
const dec=new TextDecoder(),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let record=null,mode="day";
const label=s=>s==="taken"?"Taken":s==="missed"?"Skipped":"Not logged";
const dateKey=t=>{const d=new Date(t);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};
async function key(password,salt){const raw=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},raw,{name:"AES-GCM",length:256},false,["decrypt"])}
async function unlock(){const error=document.querySelector("#error");error.textContent="";try{const payload=await fetch("data.enc.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()});const k=await key(document.querySelector("#password").value,b64(payload.salt));const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(payload.iv)},k,b64(payload.ciphertext));show(JSON.parse(dec.decode(plain)))}catch(e){error.textContent="Unable to open. Check the passphrase or data file."}}
function events(data){return (data.medications||[]).flatMap(m=>(m.events||[]).map(e=>({...e,medication:m.name,schedule:m.schedule||"",targetIntervalHours:m.targetIntervalHours||null,scheduledFor:e.scheduledFor||e.time,actualTime:e.actualTime||(e.status==="taken"?e.time:null)})))}
function stat(n,name){return `<div class="stat"><b>${n}</b><small>${name}</small></div>`}
function show(data){record=data;document.querySelector("#unlock").hidden=true;document.querySelector("#dashboard").hidden=false;document.querySelector("#patient").textContent=data.patient||"Medication record";document.querySelector("#updated").textContent="Last updated: "+new Date(data.updatedAt).toLocaleString();document.querySelector("#description").textContent=data.summary||"";const all=events(data);document.querySelector("#stats").innerHTML=stat((data.medications||[]).length,"medications")+stat(all.filter(e=>e.status==="taken").length,"taken")+stat(all.filter(e=>e.status==="missed").length,"skipped")+stat(all.filter(e=>!["taken","missed"].includes(e.status)).length,"not logged");renderIntervals(data);const notes=document.querySelector("#notes");notes.replaceChildren();for(const note of data.notes||[]){const p=document.createElement("p");p.textContent=note;notes.append(p)}if(!(data.notes||[]).length)notes.textContent="No notes.";document.querySelector("#password").value="";render()}
function renderIntervals(data){const out=document.querySelector("#intervals");out.replaceChildren();for(const med of data.medications||[]){if(!med.targetIntervalHours)continue;const taken=(med.events||[]).filter(e=>e.status==="taken").map(e=>new Date(e.actualTime||e.time)).sort((a,b)=>a-b);if(!taken.length)continue;const last=taken.at(-1),previous=taken.at(-2),next=new Date(last.getTime()+med.targetIntervalHours*3600000);const card=document.createElement("section");card.className="card interval";const h=document.createElement("h2");h.textContent=med.name;const grid=document.createElement("div");grid.className="interval-grid";const values=[["Last taken",last.toLocaleString()],["Previous gap",previous?((last-previous)/3600000).toFixed(1)+" hours":"—"],["Expected next",next.toLocaleString()]];for(const [name,value] of values){const box=document.createElement("div"),small=document.createElement("small"),strong=document.createElement("strong");small.textContent=name;strong.textContent=value;box.append(small,strong);grid.append(box)}card.append(h,grid);out.append(card)}}
function render(){const out=document.querySelector("#records");out.replaceChildren();if(mode==="day")renderDays(out);else renderMeds(out)}
function statusNode(e){const s=document.createElement("span");s.className="status "+(e.status||"unknown");s.textContent=label(e.status);return s}
function renderDays(out){const groups={};for(const e of events(record)){const scheduledDay=dateKey(e.scheduledFor);(groups[scheduledDay]??=[]).push({...e,kind:"scheduled"});if(e.status==="taken"&&e.actualTime&&dateKey(e.actualTime)!==scheduledDay){(groups[dateKey(e.actualTime)]??=[]).push({...e,kind:"actual"})}}for(const day of Object.keys(groups).sort().reverse()){const card=document.createElement("section");card.className="card day-card";const head=document.createElement("div");head.className="day-head";const d=new Date(day+"T12:00:00");const scheduled=groups[day].filter(e=>e.kind==="scheduled");head.innerHTML=`<h2>${d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</h2><span class="muted">${scheduled.filter(e=>e.status==="taken").length} taken</span>`;card.append(head);groups[day].sort((a,b)=>new Date(a.kind==="actual"?a.actualTime:a.scheduledFor)-new Date(b.kind==="actual"?b.actualTime:b.scheduledFor)).forEach(e=>{const row=document.createElement("div");row.className="row";const dot=document.createElement("span");dot.className="dot "+(e.status||"unknown");const info=document.createElement("div"),name=document.createElement("div"),detail=document.createElement("div");name.className="event-name";name.textContent=e.medication;detail.className="event-time";if(e.kind==="actual"){detail.textContent="Taken "+new Date(e.actualTime).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+" for "+new Date(e.scheduledFor).toLocaleDateString(undefined,{day:"numeric",month:"short"})+" dose"}else{detail.textContent="Scheduled "+new Date(e.scheduledFor).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});if(e.status==="taken"&&e.actualTime&&new Date(e.actualTime).getTime()!==new Date(e.scheduledFor).getTime())detail.textContent+=" · taken "+new Date(e.actualTime).toLocaleString()}if(e.note)detail.textContent+=" · "+e.note;info.append(name,detail);const status=statusNode(e);if(e.kind==="actual")status.textContent="Catch-up";row.append(dot,info,status);card.append(row)});out.append(card)}}
function renderMeds(out){for(const med of record.medications||[]){const card=document.createElement("section");card.className="card med-card";const h=document.createElement("h2");h.textContent=med.name;const schedule=document.createElement("p");schedule.className="muted";schedule.textContent=med.schedule||"";card.append(h,schedule);for(const e of med.events||[]){const row=document.createElement("div");row.className="row";const when=document.createElement("div");when.textContent="Scheduled: "+new Date(e.scheduledFor||e.time).toLocaleString()+(e.status==="taken"?" · Taken: "+new Date(e.actualTime||e.time).toLocaleString():"");row.append(when,statusNode(e));card.append(row)}out.append(card)}}
function escapeText(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function setMode(next){mode=next;for(const [id,value] of [["day-tab","day"],["med-tab","med"]]){const b=document.querySelector("#"+id),on=value===mode;b.classList.toggle("active",on);b.setAttribute("aria-selected",on)}render()}
document.querySelector("#open").addEventListener("click",unlock);
document.querySelector("#password").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
document.querySelector("#day-tab").addEventListener("click",()=>setMode("day"));
document.querySelector("#med-tab").addEventListener("click",()=>setMode("med"));
</script></body></html>
