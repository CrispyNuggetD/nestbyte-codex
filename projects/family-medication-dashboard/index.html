<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Medication Dashboard</title>
  <style>:root{font-family:system-ui,sans-serif;color:#17221d;background:#f4f7f5}body{margin:0}main{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dce5df;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #173b2510}h1{font-size:1.65rem}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #aabbb0}input{width:100%;box-sizing:border-box}button{background:#176b45;color:#fff;border:0;margin-top:10px;width:100%;font-weight:700}.muted{color:#637169}.status{font-weight:700}.taken{color:#176b45}.missed,.error{color:#a22}.row{border-top:1px solid #e7ece9;padding:12px 0}footer{font-size:.85rem;color:#637169;margin-top:24px}</style>
</head><body><main>
<h1>Medication Dashboard</h1>
<section id="unlock" class="card"><p>This dashboard is encrypted. Enter the shared family passphrase.</p><input id="password" type="password" autocomplete="current-password" placeholder="Passphrase"><button id="open">Open dashboard</button><p id="error" class="error" role="alert"></p></section>
<section id="dashboard" hidden><div class="card"><h2 id="patient"></h2><p id="updated" class="muted"></p><p id="summary"></p></div><div id="medications"></div><div class="card"><h2>Notes</h2><div id="notes"></div></div></section>
<footer>For family reference only. Confirm clinical decisions with the treating clinician. Data is decrypted only on this device.</footer>
</main><script>
const dec=new TextDecoder();const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(password,salt){const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);}
async function unlock(){const error=document.querySelector('#error');error.textContent='';try{const payload=await fetch('data.enc.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});const k=await key(document.querySelector('#password').value,b64(payload.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},k,b64(payload.ciphertext));render(JSON.parse(dec.decode(plain)));}catch(e){error.textContent='Unable to open. Check the passphrase or data file.';}}
function render(data){document.querySelector('#unlock').hidden=true;document.querySelector('#dashboard').hidden=false;document.querySelector('#patient').textContent=data.patient||'Medication record';document.querySelector('#updated').textContent='Last updated: '+new Date(data.updatedAt).toLocaleString();document.querySelector('#summary').textContent=data.summary||'';const meds=document.querySelector('#medications');meds.replaceChildren();for(const med of data.medications||[]){const card=document.createElement('div');card.className='card';const h=document.createElement('h2');h.textContent=med.name;const schedule=document.createElement('p');schedule.className='muted';schedule.textContent=med.schedule||'';card.append(h,schedule);for(const event of med.events||[]){const row=document.createElement('div');row.className='row';const when=document.createElement('div');when.textContent=new Date(event.time).toLocaleString();const status=document.createElement('div');status.className='status '+(event.status==='taken'?'taken':'missed');status.textContent=event.status==='taken'?'Taken':'Missed / not recorded';row.append(when,status);card.append(row);}meds.append(card);}const notes=document.querySelector('#notes');notes.replaceChildren();for(const note of data.notes||[]){const p=document.createElement('p');p.textContent=note;notes.append(p);}if(!(data.notes||[]).length)notes.textContent='No notes.';document.querySelector('#password').value='';}
document.querySelector('#open').addEventListener('click',unlock);document.querySelector('#password').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
