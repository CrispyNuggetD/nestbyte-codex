# GitHub Pages must be enabled with GitHub Actions as its source.
name: Deploy NestByte projects

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "projects/family-medication-dashboard/**"
      - ".github/workflows/medication-dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nestbyte-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/medication-dashboard
          cp site/index.html _site/index.html
          cp -R projects/family-medication-dashboard/. _site/medication-dashboard/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
